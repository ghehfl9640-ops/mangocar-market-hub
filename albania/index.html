<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mangocar · Korea → Shqipëri</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: harbour manifest — a cost waterfall up top, condition panels in a 2x2 grid, then the model ledger and stock list. */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --ink:#0e1a28; --muted:#566676; --line:#d8e0e8;
  --accent:#c8102e; --accent-soft:#e3e9fb; --pos:#0f7a55; --pos-soft:#dcf2e8; --neg:#b2433a; --neg-soft:#f8e3e0; --ship:#5a7896; --duty:#8a6d3b; --trans:#6b5b95;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1118; --surface:#111a24; --ink:#e5ecf3; --muted:#93a4b6; --line:#223142;
  --accent:#ff6b7f; --accent-soft:#1b2747; --pos:#45c495; --pos-soft:#123228; --neg:#e57d72; --neg-soft:#3a1d1a; --ship:#7f9cba; --duty:#c7a465; --trans:#a796d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1118; --surface:#111a24; --ink:#e5ecf3; --muted:#93a4b6; --line:#223142;
  --accent:#ff6b7f; --accent-soft:#1b2747; --pos:#45c495; --pos-soft:#123228; --neg:#e57d72; --neg-soft:#3a1d1a; --ship:#7f9cba; --duty:#c7a465; --trans:#a796d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;letter-spacing:.02em}
.plate{display:inline-flex;align-items:stretch;border:2px solid var(--ink);border-radius:5px;overflow:hidden;font-family:var(--display);font-weight:700;font-size:13px;line-height:1}
.plate .eu{background:#003399;color:#ffd400;padding:5px 5px 3px;font-size:10px;display:flex;align-items:flex-end}
.plate .txt{padding:5px 8px;background:var(--surface);color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lang button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{padding-block:36px 8px;display:grid;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.6vw,46px);line-height:1.08;margin:0;text-wrap:balance;max-width:20ch}
.lede{color:var(--muted);max-width:66ch;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.kpi{background:var(--surface);padding:16px 18px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.v.pos{color:var(--pos)}
section{padding-block:34px 0}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:72ch}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px}
.inputs{display:flex;flex-wrap:wrap;gap:14px}
.field{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select{font:500 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:160px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--bg)}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
.hl{background:var(--accent-soft)}
.gap-pos{color:var(--pos);font-weight:700}
.gap-neg{color:var(--neg);font-weight:700}
.wf{display:grid;gap:8px}
.wfrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.bar{display:flex;height:26px;border-radius:5px;overflow:hidden;background:var(--bg)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.filters .field select{width:150px}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{font-family:var(--display);font-size:16px;margin:0 0 10px}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.prow .lab{color:var(--ink)}
.prow .lab small{display:block;color:var(--muted);font-size:11.5px}
.track{position:relative;height:18px}
.track .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.track .fill{position:absolute;top:0;bottom:0;border-radius:3px}
.prow .val{text-align:right;font-weight:600}
.share{font-size:11.5px;color:var(--muted);font-weight:500}
.btn{font:600 13px var(--body);border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--accent-soft)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.pos{background:var(--pos-soft);color:var(--pos)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.car .t{font-weight:600}
.car .m{font-size:12.5px;color:var(--muted)}
.car .nums{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.car .nums span:nth-child(even){text-align:right}
.car a{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
.car a:hover{text-decoration:underline}
.car .links{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.car .kgl{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.car .kgl .chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.car .kgl a{display:flex;align-items:center;justify-content:center;gap:4px;height:30px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;white-space:nowrap}
.car .kgl a:hover{border-color:var(--accent);text-decoration:none}
.notes{font-size:13px;color:var(--muted);display:grid;gap:8px;max-width:80ch}
.notes b{color:var(--ink)}
.empty{color:var(--muted);padding:16px}
.muted{color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.panels{grid-template-columns:minmax(0,1fr)}.filters{position:static}.wfrow{grid-template-columns:84px minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.track .fill,.bar span{transition:width .35s ease,left .35s ease}}
</style>
<style>body{margin:0}[hidden]{display:none!important}.warnbox{background:var(--neg-soft);color:var(--ink);border:1px solid var(--neg);border-radius:10px;padding:12px 14px;font-size:13.5px}.warnbox b{color:var(--neg)}.field input[type=number]{width:150px}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="plate"><span class="eu">AL</span><span class="txt">KR → AL</span></span> Mangocar</div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-sq" type="button" aria-pressed="true">SQ</button>
      <button id="lang-en" type="button" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="hero">
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="h1"></h1>
    <p class="lede" data-i="lede"></p>
    <div class="warnbox" id="warn"></div>
    <div class="kpis" id="kpis"></div>
  </div>

  <section id="calc">
    <h2 data-i="calcH"></h2>
    <p class="sub" data-i="calcSub"></p>
    <div class="calc">
      <div class="inputs">
        <label class="field"><span data-i="inUsd"></span><input id="in-usd" type="number" min="0" step="100" value="12000"></label>
        <label class="field"><span data-i="inAl"></span><input id="in-al" type="number" min="0" step="100" value="17000"></label>
        <label class="field"><span data-i="inCc"></span><input id="in-cc" type="number" min="0" step="100" value="2000"></label>
      </div>
      <div class="tblwrap"><table id="calc-table"></table></div>
      <div class="wf" id="wf"></div>
      <div class="legend" id="legend"></div>
      <div class="muted" style="font-size:12.5px" id="rule"></div>
    </div>
  </section>

  <section id="conditions">
    <h2 data-i="condH"></h2>
    <p class="sub" data-i="condSub"></p>
    <div class="filters" id="filters">
      <label class="field"><span data-i="fMake"></span><select id="f-make"></select></label>
      <label class="field"><span data-i="fFuel"></span><select id="f-fuel"></select></label>
      <label class="field"><span data-i="fYear"></span><select id="f-year"></select></label>
      <label class="field"><span data-i="fKm"></span><select id="f-km"></select></label>
      <label class="field"><span data-i="fBudget"></span><select id="f-budget"></select></label>
    </div>
    <div class="panels" id="panels"></div>
  </section>

  <section id="models">
    <h2 data-i="modH"></h2>
    <p class="sub" data-i="modSub"></p>
    <div class="tblwrap"><table id="model-table"></table></div>
    <div style="margin-top:10px"><button class="btn" id="more" type="button" data-i="more"></button></div>
  </section>

  <section id="stock">
    <h2 data-i="stockH"></h2>
    <p class="sub" data-i="stockSub"></p>
    <div class="cards" id="cards"></div>
  </section>

  <section id="method">
    <h2 data-i="methH"></h2>
    <div class="notes" id="notes"></div>
  </section>
</div>

<script>
const T={
 sq:{eyebrow:"Import nga Koreja · Të dhënat më ",h1:"Sa më shumë fiton një makinë e përdorur nga Koreja?",
  lede:"Krahasuam makinat e Mangocar me njoftime të ngjashme në Shqipëri (okazion.al dhe autobox.al): e njëjta markë dhe model, i njëjti karburant, viti ±1, kilometrazh i ngjashëm. Të gjitha kostot deri në regjistrim në Shqipëri janë të përfshira.",
  warn:d=>`<b>Mostër e vogël.</b> Faqet më të mëdha shqiptare (merrjep.al, carpulse.al) nuk lejojnë mbledhjen e njoftimeve, prandaj u përdorën vetëm ${fmtN(d.alListings)} njoftime nga okazion.al dhe autobox.al. Rregullat e krahasimit janë më të gjera se në vendet e tjera (viti ±1, kilometrazhi ±50 %, të paktën 3 njoftime). Shifrat janë tregues, jo çmim tregu i sigurt.`,
  k1:"makina të krahasuara",k2:"kushtojnë më pak se çmimi në Shqipëri pas të gjitha kostove",k3:"fitimi shtesë mesatar (median) i këtyre makinave",k4:"fitimi shtesë në çerekun e sipërm (nga)",
  calcH:"Si llogarisim",calcSub:"Çmimi në Kore + kostot në Kore + transporti detar dhe sigurimi + porti, agjenti doganor dhe regjistrimi. Dogana 0 %, pa akcizë. TVSH 20 % nuk është përfshirë (e rimbursueshme për tregtarët me TVSH). Provoni shifrat tuaja.",
  inUsd:"Çmimi në Kore (USD)",inAl:"Çmimi në Shqipëri (EUR)",inCc:"Motori (cm³)",
  cUsd:"Çmimi Kore (USD)",cEur:"Çmimi Kore (EUR)",cKr:"Kostot në Kore",cShip:"Transport detar + sigurim",cDuty:"Dogana (0 %)",cLocal:"Porti + agjenti + regjistrimi",cLux:"Taksa e luksit",cFinal:"Kosto përfundimtare",cAl:"Çmimi AL",cGap:"Fitimi shtesë",
  wfK:"Kosto",wfD:"Çmimi AL",lgKr:"Makina në Kore",lgShip:"Kore + transport",lgLocal:"Porti, agjenti, regjistrimi, luksi",lgGap:"Fitimi shtesë",

  condH:"Fitimi shtesë sipas gjendjes së makinës",condSub:"Mediana e fitimit shtesë për makinë në çdo grup. Përqindja tregon sa makina në grup kushtojnë më pak se çmimi në Shqipëri pas të gjitha kostove.",
  fMake:"Marka",fFuel:"Karburanti",fYear:"Viti nga",fKm:"Kilometrazhi deri",fBudget:"Kosto deri",all:"Të gjitha",
  pAge:"Viti i regjistrimit",pKm:"Kilometrazhi",pPrice:"Kosto përfundimtare për makinë",pFuel:"Karburanti",cars:"makina",ofCars:"pozitive",
  modH:"Modelet me fitimin më të lartë",modSub:"Modeli, viti dhe karburanti me të paktën dy makina në stok, renditur sipas fitimit median. Zbatohen filtrat më sipër.",
  mModel:"Modeli",mYear:"Viti",mFuel:"Karburanti",mN:"Makina",mFinal:"Kosto (median)",mAl:"Çmimi AL (median)",mGap:"Fitimi (median)",mShare:"Pozitive",more:"Shfaq më shumë",less:"Shfaq më pak",
  stockH:"Makinat në stok me fitimin më të lartë",stockSub:"Makina individuale nga stoku i Mangocar. Lidhja e parë hap njoftimin në Mangocar me foto dhe raport inspektimi; numrat më poshtë hapin njoftimet shqiptare nga vjen çmimi.",
  sFinal:"Kosto përfundimtare",sAl:"Çmimi AL",sGap:"Fitimi shtesë",sComps:"njoftime krahasuese",open:"Njoftimi në Mangocar",alLinks:"Krahasim në Shqipëri:",
  none:"Nuk ka makina për këtë zgjedhje.",methH:"Metoda dhe supozimet",
  fuels:{Petrol:"Benzinë",Diesel:"Naftë",Hybrid:"Hibrid",Electric:"Elektrike"},
  notes:d=>[
   `<b>Burimet e të dhënave.</b> Stoku i Mangocar (${fmtN(d.mangoStock)} makina) dhe njoftimet në okazion.al (${fmtN(d.sources.okazion)}) dhe autobox.al (${fmtN(d.sources.autobox)}), marrë më ${d.date}. U krahasuan ${fmtN(d.cars.length)} makina.`,
   `<b>Çmimi në Shqipëri.</b> Mediana e çmimeve të kërkuara për të njëjtën markë dhe model, të njëjtin karburant, vitin ±1 dhe kilometrazh ±50 % (nën 20.000 km: deri 60.000 km); motori ±150 cm³ kur dihet. Të paktën 3 njoftime; vlerat ekstreme hiqen. Makinat ku çmimi shqiptar është mbi 75 % më i lartë ose më i ulët se kostoja hiqen si mospërputhje e mundshme e versionit.`,
   `<b>Kostot.</b> USD→EUR ${d.cost.usdEur} (Banka e Shqipërisë, 25.11.2026). Kostot në Kore ${fmtU(d.cost.krSide)} (çregjistrim, doganë eksporti, ngarkim). Transport detar RoRo Kore→Durrës ${fmtU(d.cost.ship)} (oferta publike të eksportuesve: $1.800–3.500 — vlerësim). Sigurim ${(d.cost.ins*100).toFixed(2)} %. Dogana 0 % dhe pa akcizë për makinat (dogana.gov.al). Porti i Durrësit €${d.cost.port} (tarifa zyrtare MBM). Agjenti doganor ${fmtU(d.cost.broker)} (vlerësim, $200–400). Regjistrimi dhe targat ${fmtE(d.cost.reg)} (vlerësim). Taksa e luksit ${fmtE(d.cost.lux)} për motor mbi ${d.cost.luxCc} cm³.`,
   `<b>Nuk përfshihen.</b> TVSH 20 % në import (e rimbursueshme për tregtarët me TVSH), TVSH në rishitje, transporti Durrës→Tiranë, taksa vjetore e mjetit, përgatitja dhe financimi. Makinat duhet të plotësojnë standardin Euro 4 (VKM 633/2018). Çmimet shqiptare janë çmime të kërkuara në njoftime.`,
   `<b>Shënim.</b> Të gjitha shifrat janë vlerësime nga njoftime publike dhe nuk janë premtim për çmim shitjeje.`]},
 en:{eyebrow:"Import from Korea · Data as of ",h1:"How much more does a used car from Korea earn in Albania?",
  lede:"We compared Mangocar's stock with similar listings in Albania (okazion.al and autobox.al): same make and model, same fuel, year ±1, similar mileage. All costs up to registration in Albania are included.",

  wfK:"Cost",wfD:"Albanian price",lgKr:"Car in Korea",lgShip:"Korea side + freight",lgLocal:"Port, broker, registration, luxury",lgGap:"Extra margin",

  fMake:"Make",fFuel:"Fuel",fYear:"Registered from",fKm:"Mileage up to",fBudget:"Final cost up to",all:"All",
  pAge:"First registration",pKm:"Mileage",pPrice:"Final cost per car",pFuel:"Fuel",cars:"cars",ofCars:"positive",

  mModel:"Model",mYear:"Year",mFuel:"Fuel",mN:"Cars",mFinal:"Final cost (median)",mAl:"Albanian price (median)",mGap:"Extra margin (median)",mShare:"Positive",more:"Show more",less:"Show less",

  notes:d=>[
   `<b>Data sources.</b> Mangocar stock (${fmtN(d.mangoStock)} cars) and listings on okazion.al (${fmtN(d.sources.okazion)}) and autobox.al (${fmtN(d.sources.autobox)}), retrieved on ${d.date}. ${fmtN(d.cars.length)} cars were compared.`,
   `<b>Albanian price.</b> Median asking price for the same make and model, same fuel, year ±1 and mileage ±50% (below 20,000 km: up to 60,000 km); engine ±150 cm³ where known. At least 3 listings; outliers removed. Cars whose Albanian price is more than 75% above or below the final cost are left out as a likely trim mismatch.`,
   `<b>Costs.</b> USD→EUR ${d.cost.usdEur} (Bank of Albania, 25 Nov 2026). Korea-side ${fmtU(d.cost.krSide)} (deregistration, export clearance, loading). RoRo sea freight Korea→Durrës ${fmtU(d.cost.ship)} (exporters' published quotes $1,800–3,500 — estimate). Insurance ${(d.cost.ins*100).toFixed(2)}%. 0% customs duty and no excise on cars (dogana.gov.al). Durrës port €${d.cost.port} (official MBM tariff). Customs broker ${fmtU(d.cost.broker)} (estimate, $200–400). Registration and plates ${fmtE(d.cost.reg)} (estimate). Luxury tax ${fmtE(d.cost.lux)} for engines above ${d.cost.luxCc} cm³.`,
   `<b>Not included.</b> 20% import VAT (recoverable for VAT-registered dealers), VAT on resale, Durrës→Tirana transport, annual vehicle tax, reconditioning and financing. Cars must meet Euro 4 (DCM 633/2018). Albanian prices are listing asking prices.`,
   `<b>Note.</b> All figures are estimates based on public listings and are not a promise of a sale price.`]}
};
let L='sq',D=null,showAll=false;
try{const s=localStorage.getItem('kr-al-lang');if(s==='en'||s==='sq')L=s}catch(e){}
const loc=()=>L==='sq'?'de-DE':'en-GB';
function fmtN(n){return Math.round(n).toLocaleString(loc())}
function fmtE(n){return (n<0?'−':'')+'€'+Math.abs(Math.round(n)).toLocaleString(loc())}
function fmtSigned(n){return (n>0?'+':n<0?'−':'')+'€'+Math.abs(Math.round(n)).toLocaleString(loc())}
function fmtU(n){return '$'+Math.round(n).toLocaleString(loc())}
function pct(x){return Math.round(x*100)+(L==='sq'?' %':'%')}
function med(a){if(!a.length)return NaN;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function q(a,p){if(!a.length)return NaN;const s=[...a].sort((x,y)=>x-y),pos=(s.length-1)*p,lo=Math.floor(pos),hi=Math.ceil(pos);return s[lo]+(s[hi]-s[lo])*(pos-lo)}
const C0={usdEur:.9139,krSide:250,ship:2200,ins:.0065,duty:0,port:7,broker:300,reg:95,luxCc:3000,lux:781,vat:.2};
function cost(usd,cc,c){const e=c.usdEur,car=usd*e,kr=c.krSide*e,ship=c.ship*e,ins=(usd+c.krSide+c.ship)*c.ins*e,duty=(car+kr+ship+ins)*c.duty,local=c.port+c.broker*e+c.reg,lux=(cc||0)>c.luxCc?c.lux:0;
  return {car,kr,ship,ins,duty,local,lux,final:car+kr+ship+ins+duty+local+lux}}
const $=id=>document.getElementById(id);
const host=u=>{try{return new URL(u).hostname.replace('www.','')}catch(e){return ''}};

function applyText(){
  const t=T[L];document.documentElement.lang=L;
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;if(typeof t[k]==='string')el.textContent=t[k]});
  document.querySelector('[data-i="eyebrow"]').textContent=t.eyebrow+(D?D.date:'');
  $('lang-sq').setAttribute('aria-pressed',L==='sq');$('lang-en').setAttribute('aria-pressed',L==='en');
  $('warn').innerHTML=D?t.warn(D):'';
}
function renderCalc(){
  const t=T[L],c=D?D.cost:C0;
  const usd=+$('in-usd').value||0,al=+$('in-al').value||0,cc=+$('in-cc').value||0,k=cost(usd,cc,c),gap=al-k.final;
  $('calc-table').innerHTML=`<thead><tr><th>${t.cUsd}</th><th>${t.cEur}</th><th>${t.cKr}</th><th>${t.cShip}</th><th>${t.cDuty}</th><th>${t.cLocal}</th><th>${t.cLux}</th><th class="hl">${t.cFinal}</th><th>${t.cAl}</th><th class="hl">${t.cGap}</th></tr></thead>
   <tbody><tr><td>${fmtU(usd)}</td><td>${fmtE(k.car)}</td><td>${fmtE(k.kr)}</td><td>${fmtE(k.ship+k.ins)}</td><td>${fmtE(k.duty)}</td><td>${fmtE(k.local)}</td><td>${fmtE(k.lux)}</td><td class="hl"><b>${fmtE(k.final)}</b></td><td>${fmtE(al)}</td><td class="hl ${gap>=0?'gap-pos':'gap-neg'}">${fmtSigned(gap)}</td></tr></tbody>`;
  const max=Math.max(k.final,al,1),w=v=>(Math.max(0,v)/max*100).toFixed(2)+'%';
  $('wf').innerHTML=`<div class="wfrow"><span>${t.wfK}</span><div class="bar"><span style="width:${w(k.car)};background:var(--accent)"></span><span style="width:${w(k.kr+k.ship+k.ins)};background:var(--ship)"></span><span style="width:${w(k.duty+k.local+k.lux)};background:var(--trans)"></span></div></div>
   <div class="wfrow"><span>${t.wfD}</span><div class="bar"><span style="width:${w(Math.min(al,k.final))};background:var(--line)"></span><span style="width:${w(gap)};background:var(--pos)"></span></div></div>`;
  $('legend').innerHTML=[['var(--accent)',t.lgKr],['var(--ship)',t.lgShip],['var(--trans)',t.lgLocal],['var(--pos)',t.lgGap]].map(([c2,l])=>`<span><i style="background:${c2}"></i>${l}</span>`).join('');
  $('rule').textContent=cc>c.luxCc?t.ruleLux(c):t.ruleNoLux(c);
}
function enrich(){D.rows=D.cars.map(r=>{const k=cost(r[5],r[9],D.cost);return {mk:r[0],mo:r[1],y:r[2],f:r[3],km:r[4]*1000,usd:r[5],al:r[6],n:r[7],code:r[8],cc:r[9],links:r[10]||[],final:k.final,gap:r[6]-k.final}})}
function fillFilters(){
  const t=T[L],keep=id=>$(id).value;
  const mv=keep('f-make'),fv=keep('f-fuel'),yv=keep('f-year'),kv=keep('f-km'),bv=keep('f-budget');
  const cnt={};D.rows.forEach(r=>cnt[r.mk]=(cnt[r.mk]||0)+1);
  const mk=D.makes.map((m,i)=>[i,m,cnt[i]||0]).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]);
  $('f-make').innerHTML=`<option value="">${t.all}</option>`+mk.map(([i,m,n])=>`<option value="${i}">${m} (${fmtN(n)})</option>`).join('');
  $('f-fuel').innerHTML=`<option value="">${t.all}</option>`+D.fuels.map((f,i)=>`<option value="${i}">${t.fuels[f]}</option>`).join('');
  $('f-year').innerHTML=`<option value="">${t.all}</option>`+[2014,2016,2018,2020,2022,2024].map(y=>`<option value="${y}">${y}</option>`).join('');
  $('f-km').innerHTML=`<option value="">${t.all}</option>`+[30000,60000,100000,150000].map(k=>`<option value="${k}">${fmtN(k)} km</option>`).join('');
  $('f-budget').innerHTML=`<option value="">${t.all}</option>`+[10000,20000,30000,50000,80000].map(b=>`<option value="${b}">${fmtE(b)}</option>`).join('');
  $('f-make').value=mv;$('f-fuel').value=fv;$('f-year').value=yv;$('f-km').value=kv;$('f-budget').value=bv;
}
function filtered(){
  const m=$('f-make').value,f=$('f-fuel').value,y=+$('f-year').value||0,k=+$('f-km').value||Infinity,b=+$('f-budget').value||Infinity;
  return D.rows.filter(r=>(m===''||r.mk==m)&&(f===''||r.f==f)&&r.y>=y&&r.km<=k&&r.final<=b);
}
function renderKpis(rows){
  const t=T[L],pos=rows.filter(r=>r.gap>0),g=pos.map(r=>r.gap);
  $('kpis').innerHTML=[[fmtN(rows.length),t.k1,''],[rows.length?pct(pos.length/rows.length):'–',t.k2,''],[g.length?fmtSigned(med(g)):'–',t.k3,'pos'],[g.length?fmtSigned(q(g,.75)):'–',t.k4,'pos']]
   .map(([v,l,c])=>`<div class="kpi"><div class="v ${c}">${v}</div><div class="l">${l}</div></div>`).join('');
}
function panel(title,groups){
  const vals=groups.filter(g=>g.rows.length).map(g=>med(g.rows.map(r=>r.gap)));
  const mx=Math.max(1,...vals.map(Math.abs)),hasNeg=vals.some(v=>v<0),zero=hasNeg?50:0,scale=hasNeg?50:100;
  const t=T[L];
  return `<div class="panel"><h3>${title}</h3>`+groups.map(g=>{
    const n=g.rows.length;if(!n)return `<div class="prow"><span class="lab">${g.label}</span><span class="muted" style="font-size:12px">–</span><span></span></div>`;
    const v=med(g.rows.map(r=>r.gap)),share=g.rows.filter(r=>r.gap>0).length/n,w=Math.abs(v)/mx*scale;
    const left=v>=0?zero:zero-w;
    return `<div class="prow"><span class="lab">${g.label}<small>${fmtN(n)} ${t.cars}</small></span><div class="track">${hasNeg?`<span class="zero" style="left:${zero}%"></span>`:''}<span class="fill" style="left:${left}%;width:${w}%;background:${v>=0?'var(--pos)':'var(--neg)'}"></span></div><span class="val ${v>=0?'gap-pos':'gap-neg'}">${fmtSigned(v)}<div class="share">${pct(share)} ${t.ofCars}</div></span></div>`}).join('')+`</div>`;
}
function renderPanels(rows){
  const t=T[L],by=(fn,defs)=>defs.map(([label,test])=>({label,rows:rows.filter(r=>test(fn(r)))}));
  const age=by(r=>r.y,[['2024–2026',y=>y>=2024],['2021–2023',y=>y>=2021&&y<=2023],['2018–2020',y=>y>=2018&&y<=2020],['2015–2017',y=>y>=2015&&y<=2017],['2012–2014',y=>y<=2014]]);
  const km=by(r=>r.km,[['< 30.000',k=>k<30000],['30–60.000',k=>k>=30000&&k<60000],['60–100.000',k=>k>=60000&&k<100000],['100–150.000',k=>k>=100000&&k<150000],['≥ 150.000',k=>k>=150000]]);
  const pr=by(r=>r.final,[['< €10.000',v=>v<10000],['€10–20.000',v=>v>=10000&&v<20000],['€20–35.000',v=>v>=20000&&v<35000],['€35–50.000',v=>v>=35000&&v<50000],['≥ €50.000',v=>v>=50000]]);
  const fu=D.fuels.map((f,i)=>({label:t.fuels[f],rows:rows.filter(r=>r.f===i)}));
  const fixKm=a=>a.map(g=>({...g,label:L==='sq'?g.label:g.label.replace(/\./g,',')}));
  $('panels').innerHTML=panel(t.pAge,age)+panel(t.pKm+' (km)',fixKm(km))+panel(t.pPrice,fixKm(pr))+panel(t.pFuel,fu);
}
function renderModels(rows){
  const t=T[L],g={};rows.forEach(r=>{const k=r.mo+'|'+r.y+'|'+r.f;(g[k]=g[k]||[]).push(r)});
  let list=Object.values(g).filter(a=>a.length>=2).map(a=>({mk:a[0].mk,mo:a[0].mo,y:a[0].y,f:a[0].f,n:a.length,fin:med(a.map(r=>r.final)),al:med(a.map(r=>r.al)),gap:med(a.map(r=>r.gap)),share:a.filter(r=>r.gap>0).length/a.length}));
  list.sort((a,b)=>b.gap-a.gap);const shown=showAll?list.slice(0,100):list.slice(0,15);
  $('model-table').innerHTML=`<thead><tr><th class="l">${t.mModel}</th><th>${t.mYear}</th><th class="l">${t.mFuel}</th><th>${t.mN}</th><th>${t.mFinal}</th><th>${t.mAl}</th><th>${t.mGap}</th><th>${t.mShare}</th></tr></thead><tbody>`+
   (shown.length?shown.map(x=>`<tr><td class="l">${D.makes[x.mk]} ${D.models[x.mo]}</td><td>${x.y}</td><td class="l">${t.fuels[D.fuels[x.f]]}</td><td>${x.n}</td><td>${fmtE(x.fin)}</td><td>${fmtE(x.al)}</td><td class="${x.gap>=0?'gap-pos':'gap-neg'}">${fmtSigned(x.gap)}</td><td><span class="pill ${x.share>=.5?'pos':'neg'}">${pct(x.share)}</span></td></tr>`).join(''):`<tr><td class="l empty" colspan="8">${t.none}</td></tr>`)+`</tbody>`;
  $('more').hidden=list.length<=15;$('more').textContent=showAll?t.less:t.more;
}
function renderCards(rows){
  const t=T[L],top=[...rows].filter(r=>r.gap>0).sort((a,b)=>b.gap-a.gap).slice(0,24);
  $('cards').innerHTML=top.length?top.map(r=>`<div class="car"><div><div class="t">${D.makes[r.mk]} ${D.models[r.mo]}</div><div class="m">${r.y} · ${t.fuels[D.fuels[r.f]]} · ${fmtN(r.km)} km${r.cc?` · ${fmtN(r.cc)} cm³`:''}</div></div>
   <div class="nums"><span>${t.sFinal}</span><span>${fmtE(r.final)}</span><span>${t.sAl}</span><span>${fmtE(r.al)}</span><span>${t.sGap}</span><span class="gap-pos">${fmtSigned(r.gap)}</span></div>
   <div class="m">${r.n} ${t.sComps} · ${fmtU(r.usd)} Korea</div>
   <div class="links"><a href="https://mangoworldcar.com/${L==='sq'?'al':'en'}/car-detail/${r.code}" target="_blank" rel="noopener">${t.open} →</a>
   ${r.links.length?`<div class="kgl"><span>${t.alLinks}</span><span class="chips">${r.links.map((u,i)=>/^https:\/\//.test(u)?`<a href="${u}" target="_blank" rel="noopener" title="${host(u)}">${i+1} ↗</a>`:'').join('')}</span></div>`:''}</div></div>`).join(''):`<div class="empty">${t.none}</div>`;
}
function renderNotes(){$('notes').innerHTML=T[L].notes(D).map(s=>`<p style="margin:0">${s}</p>`).join('')}
function renderAll(){applyText();renderCalc();if(!D)return;const rows=filtered();renderKpis(rows);renderPanels(rows);renderModels(rows);renderCards(rows);renderNotes()}
function setLang(l){L=l;try{localStorage.setItem('kr-al-lang',l)}catch(e){}if(D)fillFilters();renderAll()}
$('lang-sq').onclick=()=>setLang('sq');$('lang-en').onclick=()=>setLang('en');
['in-usd','in-al','in-cc'].forEach(id=>$(id).addEventListener('input',renderCalc));
['f-make','f-fuel','f-year','f-km','f-budget'].forEach(id=>$(id).addEventListener('change',()=>{showAll=false;renderAll()}));
$('more').onclick=()=>{showAll=!showAll;renderModels(filtered())};
applyText();renderCalc();
fetch('data.json?v=20261126a').then(r=>r.json()).then(d=>{D=d;enrich();fillFilters();renderAll()}).catch(()=>{$('kpis').innerHTML='<div class="kpi"><div class="l">Data could not be loaded.</div></div>'});
</script>
